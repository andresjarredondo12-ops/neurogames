<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Entrenamiento Cognitivo PRO</title>

<style>
body { font-family: Arial; margin:0; text-align:center; background:#eef2f7; }
h1 { background:#4a90e2; color:white; padding:15px; margin:0; }

#game { padding:20px; }

.card {
    width:70px;height:70px;display:inline-flex;align-items:center;justify-content:center;
    margin:5px;background:#4a90e2;color:white;font-size:22px;border-radius:10px;cursor:pointer;
}
.hidden { background:#999; }

button {
    padding:12px 18px;font-size:18px;margin:8px;border:none;border-radius:8px;cursor:pointer;
}

.correct { background:green !important; color:white; }
.wrong { background:red !important; color:white; }

/* pantallas */
#welcome, #success {
    position:fixed;width:100%;height:100%;
    display:flex;flex-direction:column;justify-content:center;align-items:center;
}
#welcome { background:#4a90e2;color:white; }
#success { background:yellow;display:none;overflow:hidden; }

/* animacion */
.fall {
    position:absolute;font-size:24px;
    animation:fall linear infinite;
}
@keyframes fall {
    0% { top:-50px; }
    100% { top:100%; }
}
</style>
</head>

<body>

<h1>🧠 Entrenamiento Cognitivo PRO</h1>

<div id="welcome">
    <h2>Bienvenido</h2>
    <button onclick="startApp()">Comenzar</button>
</div>

<div id="game"></div>

<div id="success">
    <h2 id="successText"></h2>
    <button onclick="nextLevel()">Próximo nivel</button>
</div>

<script>
let level = 1;
let step = 0;
let gameActive = false;
let locked = false;
let timers = [];

/* -------- CORE -------- */

function startApp(){
    document.getElementById("welcome").style.display="none";
    startLevel();
}

function startLevel(){
    step = 0;
    runStep();
}

function runStep(){
    resetAll();
    gameActive = true;

    if(step < 2) memoryGame();
    else if(step < 4) brainExercise();
    else showSuccess();
}

/* -------- RESET TOTAL -------- */

function resetAll(){
    gameActive = false;
    locked = false;

    // limpiar timers
    timers.forEach(t => clearTimeout(t));
    timers = [];

    // limpiar UI
    document.getElementById("game").innerHTML = "";
}

/* -------- CONTROL -------- */

function finishStep(){
    if(!gameActive || locked) return;

    locked = true;
    gameActive = false;

    let btn = document.createElement("button");
    btn.innerText = "Próximo";
    btn.onclick = ()=>{
        step++;
        runStep();
    };

    document.getElementById("game").appendChild(btn);
}

/* -------- MEMORIA -------- */

function memoryGame(){
    let size = Math.min(4 + level, 12);
    if(size % 2 !== 0) size++;

    let values=[];
    for(let i=0;i<size/2;i++) values.push(i,i);
    values.sort(()=>Math.random()-0.5);

    let first=null, lock=false, matches=0;

    values.forEach(val=>{
        let div=document.createElement("div");
        div.className="card hidden";
        div.innerText="?";

        div.onclick=()=>{
            if(!gameActive || lock || !div.classList.contains("hidden")) return;

            div.innerText=val;
            div.classList.remove("hidden");

            if(!first){
                first=div;
            } else {
                if(first.innerText===div.innerText){
                    matches++;
                    first=null;

                    if(matches===size/2) finishStep();

                } else {
                    lock=true;
                    let t=setTimeout(()=>{
                        div.innerText="?";
                        first.innerText="?";
                        div.classList.add("hidden");
                        first.classList.add("hidden");
                        first=null;
                        lock=false;
                    },700);
                    timers.push(t);
                }
            }
        };

        document.getElementById("game").appendChild(div);
    });
}

/* -------- EJERCICIOS -------- */

function brainExercise(){
    let types=[attentionGame, mathGame, sequenceGame];
    let fn = types[Math.floor(Math.random()*types.length)];
    fn();
}

/* atención */
function attentionGame(){
    let target=Math.floor(Math.random()*9);

    let title=document.createElement("h2");
    title.innerText=`Toca todos los ${target}`;
    game.appendChild(title);

    let total=10;
    let needed=4;

    let nums=[];

    for(let i=0;i<needed;i++) nums.push(target);
    while(nums.length<total){
        let n=Math.floor(Math.random()*9);
        if(n!==target) nums.push(n);
    }

    nums.sort(()=>Math.random()-0.5);

    let correct=0;

    nums.forEach(num=>{
        let btn=document.createElement("button");
        btn.innerText=num;

        btn.onclick=()=>{
            if(!gameActive || btn.disabled) return;

            btn.disabled=true;

            if(num===target){
                btn.classList.add("correct");
                correct++;
                if(correct===needed) finishStep();
            } else {
                btn.classList.add("wrong");
            }
        };

        game.appendChild(btn);
    });
}

/* matemática */
function mathGame(){
    let a=Math.floor(Math.random()*10);
    let b=Math.floor(Math.random()*10);
    let correct=a+b;

    let title=document.createElement("h2");
    title.innerText=`${a} + ${b} = ?`;
    game.appendChild(title);

    let options=[correct];
    while(options.length<4){
        let n=correct + Math.floor(Math.random()*6)-3;
        if(!options.includes(n)) options.push(n);
    }

    options.sort(()=>Math.random()-0.5);

    options.forEach(val=>{
        let btn=document.createElement("button");
        btn.innerText=val;

        btn.onclick=()=>{
            if(!gameActive) return;

            if(val===correct){
                btn.classList.add("correct");
                finishStep();
            } else {
                btn.classList.add("wrong");
            }
        };

        game.appendChild(btn);
    });
}

/* secuencia */
function sequenceGame(){
    let seq=[];
    let len=3;

    for(let i=0;i<len;i++) seq.push(Math.floor(Math.random()*9));

    let text=document.createElement("h2");
    text.innerText="Memoriza:";
    game.appendChild(text);

    let display=document.createElement("div");
    display.innerText=seq.join(" ");
    game.appendChild(display);

    let t=setTimeout(()=>{
        display.innerText="???";

        let input=document.createElement("input");

        let btn=document.createElement("button");
        btn.innerText="Verificar";

        btn.onclick=()=>{
            if(!gameActive) return;

            let val=input.value.replace(/\s/g,"");
            if(val===seq.join("")) finishStep();
        };

        game.appendChild(input);
        game.appendChild(btn);

    },2000);

    timers.push(t);
}

/* -------- SUCCESS -------- */

function showSuccess(){
    gameActive=false;

    let s=document.getElementById("success");
    s.style.display="flex";

    document.getElementById("successText").innerText=
        `⭐ Felicidades! Superaste el nivel ${level} 💛`;

    rain();
}

function rain(){
    let c=document.getElementById("success");

    for(let i=0;i<30;i++){
        let e=document.createElement("div");
        e.className="fall";
        e.innerText=Math.random()>0.5?"⭐":"💛";
        e.style.left=Math.random()*100+"%";
        e.style.animationDuration=(2+Math.random()*3)+"s";
        c.appendChild(e);
    }
}

function nextLevel(){
    let s=document.getElementById("success");
    s.style.display="none";
    s.innerHTML='<h2 id="successText"></h2><button onclick="nextLevel()">Próximo nivel</button>';

    level++;
    startLevel();
}
</script>

</body>
</html>
