<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Entrenamiento Cognitivo PRO</title>

<style>
body {
    font-family: Arial;
    margin: 0;
    text-align: center;
    background: #eef2f7;
}

h1 {
    background: #4a90e2;
    color: white;
    padding: 15px;
}

#game {
    padding: 20px;
}

.card {
    width: 70px;
    height: 70px;
    display: inline-flex;
    justify-content: center;
    align-items: center;
    margin: 5px;
    background: #4a90e2;
    color: white;
    font-size: 22px;
    border-radius: 10px;
    cursor: pointer;
}

.hidden { background: #999; }

button {
    padding: 12px 20px;
    font-size: 18px;
    margin: 8px;
    cursor: pointer;
    border-radius: 8px;
    border: none;
}

.correct { background: green !important; }
.wrong { background: red !important; }

/* Bienvenida */
#welcome {
    position: fixed;
    width: 100%;
    height: 100%;
    background: #4a90e2;
    color: white;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

/* Éxito */
#success {
    display: none;
    position: fixed;
    width: 100%;
    height: 100%;
    background: yellow;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-size: 28px;
    overflow: hidden;
}

/* Animación */
.fall {
    position: absolute;
    font-size: 24px;
    animation: fall linear infinite;
}

@keyframes fall {
    0% { top: -50px; }
    100% { top: 100%; }
}
</style>
</head>

<body>

<h1>🧠 Entrenamiento Cognitivo PRO</h1>

<div id="welcome">
    <h2>Bienvenido</h2>
    <button onclick="startApp()">Comenzar</button>
</div>

<div id="game"></div>

<div id="success">
    <h2 id="successText"></h2>
    <button onclick="nextLevel()">Próximo nivel</button>
</div>

<script>
let level = 1;
let step = 0;
let gameActive = false;

/* ---------- CORE ---------- */

function startApp() {
    document.getElementById("welcome").style.display = "none";
    startLevel();
}

function startLevel() {
    step = 0;
    runStep();
}

function runStep() {
    clearGame();
    gameActive = true;

    if (step < 2) memoryGame();
    else if (step < 4) brainExercise();
    else showSuccess();
}

function clearGame() {
    let game = document.getElementById("game");
    game.innerHTML = "";
}

/* ---------- CONTROL ---------- */

function finishStep() {
    if (!gameActive) return;
    gameActive = false;

    let btn = document.createElement("button");
    btn.innerText = "Próximo";
    btn.onclick = () => {
        step++;
        runStep();
    };

    document.getElementById("game").appendChild(btn);
}

/* ---------- MEMORIA ---------- */

function memoryGame() {
    let size = Math.min(4 + level, 12);
    if (size % 2 !== 0) size++;

    let values = [];
    for (let i = 0; i < size / 2; i++) values.push(i, i);

    values.sort(() => Math.random() - 0.5);

    let first = null;
    let lock = false;
    let matches = 0;

    values.forEach(val => {
        let div = document.createElement("div");
        div.className = "card hidden";
        div.innerText = "?";

        div.onclick = () => {
            if (!gameActive || lock || !div.classList.contains("hidden")) return;

            div.innerText = val;
            div.classList.remove("hidden");

            if (!first) {
                first = div;
            } else {
                if (first.innerText === div.innerText) {
                    matches++;
                    first = null;

                    if (matches === size / 2) finishStep();

                } else {
                    lock = true;
                    setTimeout(() => {
                        div.innerText = "?";
                        first.innerText = "?";
                        div.classList.add("hidden");
                        first.classList.add("hidden");
                        first = null;
                        lock = false;
                    }, 700);
                }
            }
        };

        document.getElementById("game").appendChild(div);
    });
}

/* ---------- EJERCICIOS ---------- */

function brainExercise() {
    let type = Math.floor(Math.random() * 3);
    if (type === 0) attentionGame();
    if (type === 1) mathGame();
    if (type === 2) sequenceGame();
}

/* Atención */
function attentionGame() {
    let target = Math.floor(Math.random() * 9);

    let title = document.createElement("h2");
    title.innerText = `Toca todos los ${target}`;
    document.getElementById("game").appendChild(title);

    let total = 10 + level;
    let needed = Math.floor(total / 2);

    let numbers = [];

    for (let i = 0; i < needed; i++) numbers.push(target);

    while (numbers.length < total) {
        let n = Math.floor(Math.random() * 9);
        if (n !== target) numbers.push(n);
    }

    numbers.sort(() => Math.random() - 0.5);

    let correct = 0;

    numbers.forEach(num => {
        let btn = document.createElement("button");
        btn.innerText = num;

        btn.onclick = () => {
            if (!gameActive || btn.disabled) return;

            btn.disabled = true;

            if (num === target) {
                btn.classList.add("correct");
                correct++;
                if (correct === needed) finishStep();
            } else {
                btn.classList.add("wrong");
            }
        };

        document.getElementById("game").appendChild(btn);
    });
}

/* Matemática */
function mathGame() {
    let a = Math.floor(Math.random() * (10 + level));
    let b = Math.floor(Math.random() * (10 + level));
    let correct = a + b;

    let title = document.createElement("h2");
    title.innerText = `${a} + ${b} = ?`;
    document.getElementById("game").appendChild(title);

    let options = new Set([correct]);

    while (options.size < 4) {
        options.add(correct + Math.floor(Math.random() * 6) - 3);
    }

    Array.from(options).forEach(val => {
        let btn = document.createElement("button");
        btn.innerText = val;

        btn.onclick = () => {
            if (!gameActive) return;

            if (val === correct) {
                btn.classList.add("correct");
                finishStep();
            } else {
                btn.classList.add("wrong");
            }
        };

        document.getElementById("game").appendChild(btn);
    });
}

/* Secuencia */
function sequenceGame() {
    let seq = [];
    let len = 3 + Math.floor(level / 2);

    for (let i = 0; i < len; i++) {
        seq.push(Math.floor(Math.random() * 9));
    }

    let text = document.createElement("h2");
    text.innerText = "Memoriza:";
    document.getElementById("game").appendChild(text);

    let display = document.createElement("div");
    display.innerText = seq.join(" ");
    document.getElementById("game").appendChild(display);

    setTimeout(() => {
        display.innerText = "???";

        let input = document.createElement("input");

        let btn = document.createElement("button");
        btn.innerText = "Verificar";

        btn.onclick = () => {
            if (!gameActive) return;

            let val = input.value.replace(/\s/g, "");
            if (val === seq.join("")) finishStep();
        };

        document.getElementById("game").appendChild(input);
        document.getElementById("game").appendChild(btn);

    }, 2000);
}

/* ---------- ÉXITO ---------- */

function showSuccess() {
    gameActive = false;

    let success = document.getElementById("success");
    success.style.display = "flex";

    document.getElementById("successText").innerText =
        `⭐ Felicidades! Nivel ${level} completado 💛`;

    createRain();
}

function createRain() {
    let container = document.getElementById("success");

    for (let i = 0; i < 30; i++) {
        let el = document.createElement("div");
        el.className = "fall";
        el.innerText = Math.random() > 0.5 ? "⭐" : "💛";
        el.style.left = Math.random() * 100 + "%";
        el.style.animationDuration = (2 + Math.random() * 3) + "s";
        container.appendChild(el);
    }
}

function nextLevel() {
    let success = document.getElementById("success");
    success.style.display = "none";

    success.innerHTML = `
        <h2 id="successText"></h2>
        <button onclick="nextLevel()">Próximo nivel</button>
    `;

    level++;
    startLevel();
}
</script>

</body>
</html>
