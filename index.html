<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Entrenamiento Cognitivo</title>

<style>
body {
    font-family: Arial;
    margin: 0;
    text-align: center;
    background: #eef2f7;
}

h1 {
    background: #4a90e2;
    color: white;
    padding: 15px;
}

#game {
    padding: 20px;
}

.card {
    width: 70px;
    height: 70px;
    display: inline-flex;
    justify-content: center;
    align-items: center;
    margin: 5px;
    background: #4a90e2;
    color: white;
    font-size: 22px;
    border-radius: 10px;
    cursor: pointer;
}

.hidden {
    background: #999;
}

button {
    padding: 12px 20px;
    font-size: 18px;
    margin: 15px;
    cursor: pointer;
}

/* Bienvenida */
#welcome {
    position: fixed;
    width: 100%;
    height: 100%;
    background: #4a90e2;
    color: white;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

/* Éxito */
#success {
    display: none;
    position: fixed;
    width: 100%;
    height: 100%;
    background: yellow;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-size: 28px;
    overflow: hidden;
}

/* Animaciones */
.fall {
    position: absolute;
    font-size: 24px;
    animation: fall 3s linear infinite;
}

@keyframes fall {
    0% { top: -50px; }
    100% { top: 100%; }
}
</style>

</head>

<body>

<h1>🧠 Entrenamiento Cognitivo</h1>

<div id="welcome">
    <h2>Bienvenido</h2>
    <p>Entrena tu memoria y mente</p>
    <button onclick="startApp()">Comenzar</button>
</div>

<div id="game"></div>

<div id="success">
    <h2 id="successText"></h2>
    <button onclick="nextLevel()">Próximo nivel</button>
</div>

<script>
let level = 1;
let step = 0;

function startApp() {
    document.getElementById("welcome").style.display = "none";
    startLevel();
}

function startLevel() {
    step = 0;
    runStep();
}

function runStep() {
    document.getElementById("game").innerHTML = "";

    if (step < 2) memoryGame();
    else if (step < 4) brainExercise();
    else showSuccess();
}

/* BOTÓN SIGUIENTE */
function showNextButton() {
    let btn = document.createElement("button");
    btn.innerText = "Próximo";
    btn.onclick = () => {
        step++;
        runStep();
    };
    document.getElementById("game").appendChild(btn);
}

/* MEMORIA */
function memoryGame() {
    let size = 4 + level;
    if (size % 2 !== 0) size++;

    let values = [];
    for (let i = 0; i < size / 2; i++) {
        values.push(i, i);
    }
    values.sort(() => Math.random() - 0.5);

    let first = null;
    let lock = false;
    let matches = 0;

    values.forEach(val => {
        let div = document.createElement("div");
        div.className = "card hidden";
        div.innerText = "?";

        div.onclick = () => {
            if (lock || !div.classList.contains("hidden")) return;

            div.innerText = val;
            div.classList.remove("hidden");

            if (!first) {
                first = div;
            } else {
                if (first.innerText === div.innerText) {
                    matches++;
                    first = null;

                    if (matches === size / 2) {
                        showNextButton();
                    }

                } else {
                    lock = true;
                    setTimeout(() => {
                        div.innerText = "?";
                        first.innerText = "?";
                        div.classList.add("hidden");
                        first.classList.add("hidden");
                        first = null;
                        lock = false;
                    }, 800);
                }
            }
        };

        document.getElementById("game").appendChild(div);
    });
}

/* EJERCICIOS */
function brainExercise() {
    let type = Math.floor(Math.random() * 3);

    if (type === 0) attentionGame();
    if (type === 1) mathGame();
    if (type === 2) sequenceGame();
}

/* Atención */
function attentionGame() {
    let target = Math.floor(Math.random() * 9);

    let text = document.createElement("h2");
    text.innerText = `Toca todos los números ${target}`;
    document.getElementById("game").appendChild(text);

    let total = 6 + level;
    let correct = 0;

    for (let i = 0; i < total; i++) {
        let num = Math.floor(Math.random() * 9);

        let btn = document.createElement("button");
        btn.innerText = num;

        btn.onclick = () => {
            if (num === target) {
                btn.disabled = true;
                correct++;
                if (correct === total) showNextButton();
            }
        };

        document.getElementById("game").appendChild(btn);
    }
}

/* Matemática */
function mathGame() {
    let a = Math.floor(Math.random() * (10 + level));
    let b = Math.floor(Math.random() * (10 + level));
    let correct = a + b;

    let text = document.createElement("h2");
    text.innerText = `¿Cuánto es ${a} + ${b}?`;
    document.getElementById("game").appendChild(text);

    for (let i = 0; i < 4; i++) {
        let val = correct + Math.floor(Math.random() * 5) - 2;

        let btn = document.createElement("button");
        btn.innerText = val;

        btn.onclick = () => {
            if (val === correct) showNextButton();
        };

        document.getElementById("game").appendChild(btn);
    }
}

/* Secuencia */
function sequenceGame() {
    let seq = [];
    let length = 3 + Math.floor(level / 2);

    for (let i = 0; i < length; i++) {
        seq.push(Math.floor(Math.random() * 9));
    }

    let text = document.createElement("h2");
    text.innerText = "Memoriza la secuencia";
    document.getElementById("game").appendChild(text);

    let seqDiv = document.createElement("div");
    seqDiv.innerText = seq.join(" ");
    document.getElementById("game").appendChild(seqDiv);

    setTimeout(() => {
        seqDiv.innerText = "???";

        let input = document.createElement("input");
        input.placeholder = "Escribe números juntos";

        let btn = document.createElement("button");
        btn.innerText = "Verificar";

        btn.onclick = () => {
            if (input.value === seq.join("")) showNextButton();
        };

        document.getElementById("game").appendChild(input);
        document.getElementById("game").appendChild(btn);

    }, 2000);
}

/* PANTALLA FINAL */
function showSuccess() {
    let success = document.getElementById("success");
    success.style.display = "flex";

    document.getElementById("successText").innerText =
        `⭐ Felicidades! Superaste el nivel ${level} 💛`;

    createRain();
}

/* ANIMACIÓN */
function createRain() {
    for (let i = 0; i < 30; i++) {
        let el = document.createElement("div");
        el.className = "fall";
        el.innerText = Math.random() > 0.5 ? "⭐" : "💛";
        el.style.left = Math.random() * 100 + "%";
        el.style.animationDuration = (2 + Math.random() * 3) + "s";
        document.getElementById("success").appendChild(el);
    }
}

/* SIGUIENTE NIVEL */
function nextLevel() {
    document.getElementById("success").style.display = "none";
    document.getElementById("success").innerHTML =
        '<h2 id="successText"></h2><button onclick="nextLevel()">Próximo nivel</button>';
    level++;
    startLevel();
}
</script>

</body>
</html>
